<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff"/>
      <stop offset="40%" style="stop-color:#f5f3ff"/>
      <stop offset="70%" style="stop-color:#ede9fe"/>
      <stop offset="100%" style="stop-color:#e9e5f0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4b5fd;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#f9a8d4;stop-opacity:0.2"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="80"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#hero-bg)"/>
  <ellipse cx="300" cy="400" rx="280" ry="280" fill="url(#accent)" filter="url(#blur)"/>
  <ellipse cx="1600" cy="700" rx="320" ry="320" fill="url(#accent)" filter="url(#blur)"/>
  <circle cx="960" cy="540" r="200" fill="#e9d5ff" fill-opacity="0.15" filter="url(#blur)"/>
  <!-- Abstract shapes suggesting wellness/salon -->
  <circle cx="200" cy="200" r="120" fill="#c4b5fd" fill-opacity="0.08"/>
  <circle cx="1720" cy="250" r="100" fill="#f0abfc" fill-opacity="0.08"/>
  <path d="M960 400 Q1100 500 960 600 Q820 500 960 400" fill="none" stroke="#a78bfa" stroke-opacity="0.06" stroke-width="2"/>
</svg>
