<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- App icon with rounded square background -->
  
  <!-- Rounded square background with gradient -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)"/>
  
  <!-- Icon centered and scaled -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="180" stroke="url(#gradient1)" stroke-width="12" fill="none" opacity="0.4"/>
    <circle cx="0" cy="0" r="135" stroke="url(#gradient2)" stroke-width="15" fill="none" opacity="0.7"/>
    <circle cx="0" cy="0" r="80" stroke="url(#gradient1)" stroke-width="18" fill="none"/>
    
    <circle cx="0" cy="-180" r="20" fill="url(#gradient2)" opacity="0.9"/>
    <circle cx="0" cy="180" r="20" fill="url(#gradient2)" opacity="0.9"/>
    <circle cx="-180" cy="0" r="20" fill="url(#gradient2)" opacity="0.9"/>
    <circle cx="180" cy="0" r="20" fill="url(#gradient2)" opacity="0.9"/>
    
    <circle cx="127" cy="-127" r="15" fill="url(#gradient1)" opacity="0.6"/>
    <circle cx="-127" cy="127" r="15" fill="url(#gradient1)" opacity="0.6"/>
    <circle cx="-127" cy="-127" r="15" fill="url(#gradient1)" opacity="0.6"/>
    <circle cx="127" cy="127" r="15" fill="url(#gradient1)" opacity="0.6"/>
    
    <line x1="0" y1="-160" x2="0" y2="-100" stroke="url(#gradient2)" stroke-width="8" opacity="0.4"/>
    <line x1="0" y1="100" x2="0" y2="160" stroke="url(#gradient2)" stroke-width="8" opacity="0.4"/>
    <line x1="-160" y1="0" x2="-100" y2="0" stroke="url(#gradient2)" stroke-width="8" opacity="0.4"/>
    <line x1="100" y1="0" x2="160" y2="0" stroke="url(#gradient2)" stroke-width="8" opacity="0.4"/>
    
    <circle cx="0" cy="0" r="35" fill="url(#gradient3)" opacity="0.8"/>
    <circle cx="0" cy="0" r="18" fill="#fff" opacity="0.95"/>
  </g>
  
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B5FD9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9D7FE8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8DEFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5EFFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5EFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8DEFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4C5F9;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="gradient3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8DEFF;stop-opacity:0.8" />
    </radialGradient>
  </defs>
</svg>
